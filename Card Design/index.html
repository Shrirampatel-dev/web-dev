<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise 3</title>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single+Ink:wght@100..900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');
        body {
            background-color: gray;
            padding: 100px 40vw 100px;
        }
  *{
    margin: 0;
    padding: 0;
  }
        .card {
            background-color: white;
            height: 450px;
            width: 300px;
            border-radius: 8px;    
            }

        .image {
            padding: 4px;
        }

        .image img {
            border-radius: 6px;
        }

        .capsule span {
            border: 1.5px solid black;
            background-color: lightgray;
            border-radius: 10px;
            padding: 1px 5px;
             font-family: "Archivo Black", sans-serif;
        }

        .capsule {
            padding: 7px 5px 20px;
        }

        .content {
            padding: 5px 9px 0px;
              font-family: "Bitcount Prop Single Ink", system-ui;
        }
        .button{
            text-align: center;
        }
        .button button{
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 15px;
            background-color: rgb(145, 233, 236);
            color: rgb(0, 106, 255);
            border: none;
            margin-top: 30px;
            font-style: italic;
            font-weight: bold;
            cursor:pointer;
        }
        .button button:hover{
            background-color: rgb(0, 174, 255);
            color: rgb(255, 0, 0);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img width="290" src="https://wallpaperaccess.com/full/657782.jpg" alt="Buggati">
        </div>
        <div class="capsule">
            <span>Car</span>
            <span>Luxury</span>
        </div>
        <div class="content">
            <h1>Buggati</h1>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Enim modi suscipit placeat porro deleniti debitis
            animi laudantium dolorem, nostrum repellendus.
        </div>
        <div class="button">
            <button>Read More</button>
        </div>
    </div>
</body>

</html>
