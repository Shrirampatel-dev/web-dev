<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicolour Website</title>
    <style>
   @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
        :root{
            --color: rgb(221 174 234);
            --seccolor: rgb(198 61 237);
        }
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: var(--color);
        }
        nav{
            width: 100%;
            height: 64px;
            background-color: var(--seccolor);
        }
        ul li{
            list-style: none;
            display: inline;
            font-family: "Playfair Display", serif;
             margin: 30px;
             padding: 49px;
             font-size: 47px;
             color: rgb(232, 162, 162);
        }
    li a:hover{
       background-color: #ff00e6;
         color: white;
         text-decoration: underline;
         
      }
       li a:link{
            /* text-decoration: none; */
            color: rgb(246, 255, 0);
        }
       li a:visited{
            color: rgb(217, 24, 24);
        }
      li a:active{
            color: rgb(7, 120, 152);
        }
       nav ul li a{
            cursor:grabbing
        }
        div img{
            width: 100%;
            height: 200px;
        }
        div img:hover{
            transform: scale(0.8);
            transition: 0.3s;
        }
    </style>
</head>

<body>

</body>

</html>
